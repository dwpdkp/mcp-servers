[project]
name = "altaro-mcp"
version = "0.1.0"
description = "MCP server for read-only Altaro VM Backup reporting on Hyper-V hosts via SSH"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
